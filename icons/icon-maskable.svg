<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="82%">
      <stop offset="0%"  stop-color="#a8192e"/>
      <stop offset="55%" stop-color="#6b0f1d"/>
      <stop offset="100%" stop-color="#24050a"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#ecdfcd"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <path id="heart" d="M0,-52 C-16,-84 -74,-80 -74,-26 C-74,16 -26,52 0,80 C26,52 74,16 74,-26 C74,-80 16,-84 0,-52 Z"/>
    <path id="spade" d="M0,-80 C-22,-40 -74,-14 -74,26 C-74,58 -38,68 -18,52 C-12,47 -6,49 -8,58 L-20,92 L20,92 L8,58 C6,49 12,47 18,52 C38,68 74,58 74,26 C74,-14 22,-40 0,-80 Z"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(.72) translate(-256 -256)">

  <!-- arkadaki kart -->
  <g transform="translate(178 272) rotate(-17)" filter="url(#sh)">
    <rect x="-82" y="-114" width="164" height="228" rx="24" fill="url(#face)"/>
    <use href="#spade" fill="#1b1216" transform="translate(0 4) scale(.74)"/>
